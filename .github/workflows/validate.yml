name: Validate Life Manager
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m py_compile life_manager/app/main.py life_manager/app/database.py life_manager/app/migrate.py life_manager/app/import_mariadb.py
      - run: node --check life_manager/frontend/life-manager.js
      - run: |
          test -f life_manager/migrations/174_ha_payload_normalization.sql
          grep -q 'version: "1.7.4"' life_manager/config.yaml
          grep -q 'normalize_weekdays' life_manager/app/main.py
          grep -q 'field_validator' life_manager/app/main.py
