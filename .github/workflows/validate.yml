name: Validate Life Manager

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile life_manager/app/main.py

      - name: Validate required files
        run: |
          test -f repository.yaml
          test -f life_manager/config.yaml
          test -f life_manager/Dockerfile
          test -f life_manager/run.sh
          test -f life_manager/frontend/life-manager.js

      - name: Check add-on version
        run: |
          grep -q 'version: "1.5.2"' life_manager/config.yaml


- name: Validate v1 planner migration
  run: test -f life_manager/migrations/100_planner.sql


- name: Validate v1.0.1 planner migration
  run: test -f life_manager/migrations/101_planner_today_fix.sql


- name: Validate v1.0.2 dashboard transport migration
  run: test -f life_manager/migrations/102_dashboard_data_wrapper.sql

- name: Validate future-proof HA sensor example
  run: test -f life_manager/examples/life_manager_sensor_v1.0.2.yaml


- name: Validate v1.1 planner migration
  run: test -f life_manager/migrations/110_planner_priority_due.sql


- name: Validate v1.1.1 frontend auto-update migration
  run: test -f life_manager/migrations/111_frontend_autoreload.sql


- name: Validate stable frontend loader
  run: |
    test -f life_manager/frontend/life-manager-loader.js
    test -f life_manager/migrations/112_frontend_loader.sql


- name: Validate v1.2 planning migration
  run: test -f life_manager/migrations/120_weekly_goals.sql

      - name: Validate v1.3 occurrence migration
        run: test -f life_manager/migrations/130_quest_occurrences.sql

      - name: Validate v1.4 analytics migration
        run: test -f life_manager/migrations/140_analytics.sql


- name: Validate generated Home Assistant bridge
  run: |
    test -f life_manager/ha_bridge/life_manager_generated.yaml
    test -f life_manager/migrations/141_generated_ha_bridge.sql


- name: Validate v1.4.2 package path detection
  run: |
    test -f life_manager/migrations/142_package_path_detection.sql
    grep -q '/homeassistant/_packages' life_manager/run.sh


- name: Validate v1.4.3 bridge fix
  run: |
    test -f life_manager/migrations/143_bridge_fix.sql
    grep -q 'ha_bridge_base_url' life_manager/config.yaml
    grep -q '__LIFE_MANAGER_BASE_URL__' life_manager/ha_bridge/life_manager_generated.yaml

      - name: Validate v1.5 standalone migration
        run: test -f life_manager/migrations/150_standalone_frontend.sql


- name: Backend compile gate
  run: python -m py_compile life_manager/app/main.py life_manager/app/migrate.py

- name: Validate v1.5.1 hotfix migration
  run: test -f life_manager/migrations/151_startup_syntax_fix.sql


- name: Validate v1.5.2 direct frontend actions
  run: |
    test -f life_manager/migrations/152_direct_frontend_actions.sql
    grep -q 'frontend_api_url' life_manager/config.yaml
    python -m py_compile life_manager/app/main.py life_manager/app/migrate.py
