# AUTO-GENERATED BY LIFE MANAGER.
# This file is replaced on add-on startup.

rest_command:
  life_manager_bridge_occurrence:
    url: "__LIFE_MANAGER_BASE_URL__/quests/{{ quest_id }}/occurrence"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >-
      {{
        {
          "action": (action | string | trim | lower),
          "target_date": (
            target_date | string | trim
            if target_date is defined
               and target_date not in [none, "", "None", "null"]
            else none
          ),
          "note": (
            note | string
            if note is defined
               and note not in [none, "", "None", "null"]
            else none
          )
        } | to_json
      }}

  life_manager_bridge_health:
    url: "__LIFE_MANAGER_BASE_URL__/health"
    method: GET
    headers:
      x-api-key: !secret life_manager_api_key

  life_manager_category_create:
    url: "__LIFE_MANAGER_BASE_URL__/categories"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >-
      {{ {"name": name, "icon": icon | default("mdi:folder"), "sort_order": sort_order | default(0) | int, "active": active | default(true)} | to_json }}

  life_manager_category_update:
    url: "__LIFE_MANAGER_BASE_URL__/categories/{{ category_id }}"
    method: PUT
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >-
      {{ {"name": name, "icon": icon | default("mdi:folder"), "sort_order": sort_order | default(0) | int, "active": active | default(true)} | to_json }}

  life_manager_category_toggle:
    url: "__LIFE_MANAGER_BASE_URL__/categories/{{ category_id }}/toggle"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key


  life_manager_quest_create:
    url: "__LIFE_MANAGER_BASE_URL__/quests"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >-
      {{
        {
          "name": name,
          "category_id": category_id | int,
          "quest_type": quest_type | default("routine"),
          "description": description | default(none),
          "estimated_minutes": estimated_minutes | default(none),
          "kbr": kbr | default(none),
          "xp_mode": xp_mode | default("formula"),
          "fixed_xp": fixed_xp | default(none),
          "frequency_days": frequency_days | default(none),
          "project_factor": project_factor | default(none),
          "priority": priority | default("normal"),
          "due_date": due_date | default(none),
          "active": active | default(true),
          "weekdays": weekdays | default([]),
          "interval_days": interval_days | default(none),
          "next_due": next_due | default(none)
        } | to_json
      }}

  life_manager_quest_update:
    url: "__LIFE_MANAGER_BASE_URL__/quests/{{ quest_id }}"
    method: PUT
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >-
      {{
        {
          "name": name,
          "category_id": category_id | int,
          "quest_type": quest_type | default("routine"),
          "description": description | default(none),
          "estimated_minutes": estimated_minutes | default(none),
          "kbr": kbr | default(none),
          "xp_mode": xp_mode | default("formula"),
          "fixed_xp": fixed_xp | default(none),
          "frequency_days": frequency_days | default(none),
          "project_factor": project_factor | default(none),
          "priority": priority | default("normal"),
          "due_date": due_date | default(none),
          "active": active | default(true),
          "weekdays": weekdays | default([]),
          "interval_days": interval_days | default(none),
          "next_due": next_due | default(none)
        } | to_json
      }}

  life_manager_quest_toggle:
    url: "__LIFE_MANAGER_BASE_URL__/quests/{{ quest_id }}/toggle"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key


  life_manager_backup_create:
    url: "__LIFE_MANAGER_BASE_URL__/backups"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key

  life_manager_backup_restore:
    url: "__LIFE_MANAGER_BASE_URL__/backups/{{ backup_name }}/restore"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key

  life_manager_backup_delete:
    url: "__LIFE_MANAGER_BASE_URL__/backups/{{ backup_name }}"
    method: DELETE
    headers:
      x-api-key: !secret life_manager_api_key

script:

  life_manager_backup_create:
    alias: Life Manager - Backup erstellen
    mode: single
    sequence:
      - action: rest_command.life_manager_backup_create

  life_manager_backup_restore:
    alias: Life Manager - Backup wiederherstellen
    mode: single
    sequence:
      - action: rest_command.life_manager_backup_restore
        data:
          backup_name: "{{ backup_name }}"

  life_manager_backup_delete:
    alias: Life Manager - Backup löschen
    mode: single
    sequence:
      - action: rest_command.life_manager_backup_delete
        data:
          backup_name: "{{ backup_name }}"


  life_manager_quest_create:
    alias: Life Manager - Quest erstellen
    mode: queued
    sequence:
      - action: rest_command.life_manager_quest_create
        data:
          name: "{{ name }}"
          category_id: "{{ category_id | int }}"
          quest_type: "{{ quest_type | default('routine') }}"
          description: "{{ description | default(none) }}"
          estimated_minutes: "{{ estimated_minutes | default(none) }}"
          kbr: "{{ kbr | default(none) }}"
          xp_mode: "{{ xp_mode | default('formula') }}"
          fixed_xp: "{{ fixed_xp | default(none) }}"
          frequency_days: "{{ frequency_days | default(none) }}"
          project_factor: "{{ project_factor | default(none) }}"
          priority: "{{ priority | default('normal') }}"
          due_date: "{{ due_date | default(none) }}"
          active: "{{ active | default(true) }}"
          weekdays: "{{ weekdays | default([]) }}"
          interval_days: "{{ interval_days | default(none) }}"
          next_due: "{{ next_due | default(none) }}"

  life_manager_quest_update:
    alias: Life Manager - Quest bearbeiten
    mode: queued
    sequence:
      - action: rest_command.life_manager_quest_update
        data:
          quest_id: "{{ quest_id | int }}"
          name: "{{ name }}"
          category_id: "{{ category_id | int }}"
          quest_type: "{{ quest_type | default('routine') }}"
          description: "{{ description | default(none) }}"
          estimated_minutes: "{{ estimated_minutes | default(none) }}"
          kbr: "{{ kbr | default(none) }}"
          xp_mode: "{{ xp_mode | default('formula') }}"
          fixed_xp: "{{ fixed_xp | default(none) }}"
          frequency_days: "{{ frequency_days | default(none) }}"
          project_factor: "{{ project_factor | default(none) }}"
          priority: "{{ priority | default('normal') }}"
          due_date: "{{ due_date | default(none) }}"
          active: "{{ active | default(true) }}"
          weekdays: "{{ weekdays | default([]) }}"
          interval_days: "{{ interval_days | default(none) }}"
          next_due: "{{ next_due | default(none) }}"

  life_manager_quest_toggle:
    alias: Life Manager - Quest aktivieren oder deaktivieren
    mode: queued
    sequence:
      - action: rest_command.life_manager_quest_toggle
        data:
          quest_id: "{{ quest_id | int }}"

  life_manager_category_create:
    alias: Life Manager - Kategorie erstellen
    mode: queued
    sequence:
      - action: rest_command.life_manager_category_create
        data:
          name: "{{ name }}"
          icon: "{{ icon | default('mdi:folder') }}"
          sort_order: "{{ sort_order | default(0) }}"
          active: "{{ active | default(true) }}"

  life_manager_category_update:
    alias: Life Manager - Kategorie bearbeiten
    mode: queued
    sequence:
      - action: rest_command.life_manager_category_update
        data:
          category_id: "{{ category_id | int }}"
          name: "{{ name }}"
          icon: "{{ icon | default('mdi:folder') }}"
          sort_order: "{{ sort_order | default(0) }}"
          active: "{{ active | default(true) }}"

  life_manager_category_toggle:
    alias: Life Manager - Kategorie aktivieren oder deaktivieren
    mode: queued
    sequence:
      - action: rest_command.life_manager_category_toggle
        data:
          category_id: "{{ category_id | int }}"

  life_manager_bridge_test:
    alias: Life Manager - Bridge Test
    mode: single
    sequence:
      - stop: "Life Manager Bridge wurde erfolgreich geladen"

  life_manager_rest_test:
    alias: Life Manager - REST Test
    mode: single
    sequence:
      - action: rest_command.life_manager_bridge_health

  life_manager_quest_occurrence:
    alias: Life Manager - Quest verschieben oder auslassen
    mode: queued
    fields:
      quest_id:
        name: Quest ID
        required: true
        selector:
          number:
            min: 1
            max: 999999
            mode: box
      action:
        name: Aktion
        required: true
        selector:
          text:
      target_date:
        name: Zieldatum
        required: false
        selector:
          text:
      note:
        name: Notiz
        required: false
        selector:
          text:
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ action == 'move' }}"
            sequence:
              - action: rest_command.life_manager_bridge_occurrence
                data:
                  quest_id: "{{ quest_id | int }}"
                  action: "{{ action | string | trim | lower }}"
                  target_date: "{{ target_date }}"
                  note: "{{ note | default(none) }}"
        default:
          - action: rest_command.life_manager_bridge_occurrence
            data:
              quest_id: "{{ quest_id | int }}"
              action: "{{ action | string | trim | lower }}"
              target_date: null
              note: null
