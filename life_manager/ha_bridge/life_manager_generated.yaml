# AUTO-GENERATED BY LIFE MANAGER.
# Do not edit this file manually; it is replaced on add-on startup.

rest_command:
  life_manager_bridge_occurrence:
    url: "__LIFE_MANAGER_BASE_URL__/quests/{{ quest_id }}/occurrence"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >-
      {{
        {
          "action": action,
          "target_date": target_date | default(none),
          "note": note | default(none)
        } | to_json
      }}

script:
  life_quest_occurrence:
    alias: Life Manager - Quest verschieben/auslassen
    mode: queued
    fields:
      quest_id:
        name: Quest ID
        required: true
        selector:
          number:
            min: 1
            max: 999999
      action:
        name: Aktion
        required: true
        selector:
          select:
            options:
              - skip
              - tomorrow
              - move
              - restore
      target_date:
        name: Zieldatum
        required: false
        selector:
          date:
      note:
        name: Notiz
        required: false
        selector:
          text:
    sequence:
      - action: rest_command.life_manager_bridge_occurrence
        data:
          quest_id: "{{ quest_id }}"
          action: "{{ action }}"
          target_date: "{{ target_date | default(none) }}"
          note: "{{ note | default(none) }}"
