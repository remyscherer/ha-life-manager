# AUTO-GENERATED BY LIFE MANAGER.
# This file is replaced on add-on startup.

rest_command:
  life_manager_bridge_occurrence:
    url: "__LIFE_MANAGER_BASE_URL__/quests/{{ quest_id }}/occurrence"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >-
      {{
        {
          "action": action,
          "target_date": (
            target_date
            if target_date is defined
               and target_date not in [none, "", "None", "null"]
            else none
          ),
          "note": (
            note
            if note is defined
               and note not in [none, "", "None", "null"]
            else none
          )
        } | to_json
      }}

  life_manager_bridge_health:
    url: "__LIFE_MANAGER_BASE_URL__/health"
    method: GET
    headers:
      x-api-key: !secret life_manager_api_key

script:
  life_manager_bridge_test:
    alias: Life Manager - Bridge Test
    mode: single
    sequence:
      - stop: "Life Manager Bridge wurde erfolgreich geladen"

  life_manager_rest_test:
    alias: Life Manager - REST Test
    mode: single
    sequence:
      - action: rest_command.life_manager_bridge_health

  life_manager_quest_occurrence:
    alias: Life Manager - Quest verschieben oder auslassen
    mode: queued
    fields:
      quest_id:
        name: Quest ID
        required: true
        selector:
          number:
            min: 1
            max: 999999
            mode: box
      action:
        name: Aktion
        required: true
        selector:
          text:
      target_date:
        name: Zieldatum
        required: false
        selector:
          text:
      note:
        name: Notiz
        required: false
        selector:
          text:
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ action == 'move' }}"
            sequence:
              - action: rest_command.life_manager_bridge_occurrence
                data:
                  quest_id: "{{ quest_id | int }}"
                  action: "{{ action }}"
                  target_date: "{{ target_date }}"
                  note: "{{ note | default(none) }}"
        default:
          - action: rest_command.life_manager_bridge_occurrence
            data:
              quest_id: "{{ quest_id | int }}"
              action: "{{ action }}"
              target_date: null
              note: null
