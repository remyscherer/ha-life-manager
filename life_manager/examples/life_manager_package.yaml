rest_command:
  life_complete_quest:
    url: "http://HOME_ASSISTANT_IP:8000/quests/{{ quest_id }}/complete"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >
      {"overcome": {{ overcome | default(false) | lower }}}

  life_reward_purchase:
    url: "http://HOME_ASSISTANT_IP:8000/rewards/{{ reward_id }}/purchase"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >
      {"quantity": {{ quantity | default(1) }}}

  life_quest_toggle:
    url: "http://HOME_ASSISTANT_IP:8000/quests/{{ quest_id }}/toggle"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"

  life_day_finalize:
    url: "http://HOME_ASSISTANT_IP:8000/day/finalize"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"

  life_quest_create:
    url: "http://HOME_ASSISTANT_IP:8000/quests"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >-
      {{
        {
          "name": name,
          "category_id": category_id | int,
          "quest_type": quest_type,
          "description": description | default(none),
          "estimated_minutes": estimated_minutes | default(none),
          "kbr": kbr | default(none),
          "xp_mode": xp_mode,
          "fixed_xp": fixed_xp | default(none),
          "frequency_days": frequency_days | default(none),
          "project_factor": project_factor | default(none),
          "active": active | default(true),
          "weekdays": weekdays | default([]),
          "interval_days": interval_days | default(none),
          "next_due": next_due | default(none)
        } | to_json
      }}

  life_quest_update:
    url: "http://HOME_ASSISTANT_IP:8000/quests/{{ quest_id }}"
    method: PUT
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >-
      {{
        {
          "name": name,
          "category_id": category_id | int,
          "quest_type": quest_type,
          "description": description | default(none),
          "estimated_minutes": estimated_minutes | default(none),
          "kbr": kbr | default(none),
          "xp_mode": xp_mode,
          "fixed_xp": fixed_xp | default(none),
          "frequency_days": frequency_days | default(none),
          "project_factor": project_factor | default(none),
          "active": active | default(true),
          "weekdays": weekdays | default([]),
          "interval_days": interval_days | default(none),
          "next_due": next_due | default(none)
        } | to_json
      }}

  life_reward_create:
    url: "http://HOME_ASSISTANT_IP:8000/rewards"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >-
      {{
        {
          "name": name,
          "description": description | default(none),
          "cost": cost | int,
          "icon": icon | default(none),
          "active": active | default(true),
          "sort_order": sort_order | default(0) | int
        } | to_json
      }}

  life_reward_update:
    url: "http://HOME_ASSISTANT_IP:8000/rewards/{{ reward_id }}"
    method: PUT
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >-
      {{
        {
          "name": name,
          "description": description | default(none),
          "cost": cost | int,
          "icon": icon | default(none),
          "active": active | default(true),
          "sort_order": sort_order | default(0) | int
        } | to_json
      }}

  life_reward_toggle:
    url: "http://HOME_ASSISTANT_IP:8000/rewards/{{ reward_id }}/toggle"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"

  life_savings_goal_create:
    url: "http://HOME_ASSISTANT_IP:8000/savings-goals"
    method: POST
    headers:
      x-api-key: !secret life_manager_api_key
    content_type: "application/json"
    payload: >-
      {{
        {
          "name": name,
          "target_coins": target_coins | int,
          "reward_id": reward_id | default(none),
          "active": true
        } | to_json
      }}


rest:
  - resource: "http://HOME_ASSISTANT_IP:8000/dashboard"
    scan_interval: 60
    sensor:
      - name: "Life Manager"
        unique_id: life_manager
        value_template: "{{ value_json.data.today.progress_percent }}"
        unit_of_measurement: "%"
        json_attributes:
          - data

script:
  life_quest_complete:
    alias: Life Manager - Quest abschließen
    fields:
      quest_id:
        required: true
        selector:
          number:
            min: 1
            max: 999999
      overcome:
        selector:
          boolean:
    sequence:
      - action: rest_command.life_complete_quest
        data:
          quest_id: "{{ quest_id }}"
          overcome: "{{ overcome | default(false) }}"

  life_reward_purchase:
    alias: Life Manager - Reward kaufen
    fields:
      reward_id:
        required: true
        selector:
          number:
            min: 1
            max: 999999
      quantity:
        selector:
          number:
            min: 1
            max: 20
    sequence:
      - action: rest_command.life_reward_purchase
        data:
          reward_id: "{{ reward_id }}"
          quantity: "{{ quantity | default(1) }}"

  life_quest_toggle:
    alias: Life Manager - Quest aktivieren/deaktivieren
    fields:
      quest_id:
        required: true
        selector:
          number:
            min: 1
            max: 999999
    sequence:
      - action: rest_command.life_quest_toggle
        data:
          quest_id: "{{ quest_id }}"

  life_day_finalize:
    alias: Life Manager - Tagesabschluss
    sequence:
      - action: rest_command.life_day_finalize
      - delay: "00:00:01"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.life_manager

  life_quest_create:
    alias: Life Manager - Quest erstellen
    fields:
      name: {required: true, selector: {text: {}}}
      category_id: {required: true, selector: {number: {min: 1, max: 999}}}
      quest_type: {required: true, selector: {text: {}}}
      description: {selector: {text: {multiline: true}}}
      xp_mode: {required: true, selector: {text: {}}}
      fixed_xp: {selector: {number: {min: 0, max: 9999}}}
      estimated_minutes: {selector: {number: {min: 0, max: 10000}}}
      kbr: {selector: {number: {min: 1, max: 5}}}
      frequency_days: {selector: {number: {min: 1, max: 3650}}}
      project_factor: {selector: {number: {min: 0, max: 100}}}
      weekdays: {}
      interval_days: {selector: {number: {min: 1, max: 3650}}}
      next_due: {selector: {date: {}}}
      active: {selector: {boolean: {}}}
    sequence:
      - action: rest_command.life_quest_create
        data:
          name: "{{ name }}"
          category_id: "{{ category_id }}"
          quest_type: "{{ quest_type }}"
          description: "{{ description | default(none) }}"
          xp_mode: "{{ xp_mode }}"
          fixed_xp: "{{ fixed_xp | default(none) }}"
          estimated_minutes: "{{ estimated_minutes | default(none) }}"
          kbr: "{{ kbr | default(none) }}"
          frequency_days: "{{ frequency_days | default(none) }}"
          project_factor: "{{ project_factor | default(none) }}"
          weekdays: "{{ weekdays | default([]) }}"
          interval_days: "{{ interval_days | default(none) }}"
          next_due: "{{ next_due | default(none) }}"
          active: "{{ active | default(true) }}"

  life_quest_update:
    alias: Life Manager - Quest bearbeiten
    fields:
      quest_id: {required: true, selector: {number: {min: 1, max: 999999}}}
      name: {required: true, selector: {text: {}}}
      category_id: {required: true, selector: {number: {min: 1, max: 999}}}
      quest_type: {required: true, selector: {text: {}}}
      description: {selector: {text: {multiline: true}}}
      xp_mode: {required: true, selector: {text: {}}}
      fixed_xp: {selector: {number: {min: 0, max: 9999}}}
      estimated_minutes: {selector: {number: {min: 0, max: 10000}}}
      kbr: {selector: {number: {min: 1, max: 5}}}
      frequency_days: {selector: {number: {min: 1, max: 3650}}}
      project_factor: {selector: {number: {min: 0, max: 100}}}
      weekdays: {}
      interval_days: {selector: {number: {min: 1, max: 3650}}}
      next_due: {selector: {date: {}}}
      active: {selector: {boolean: {}}}
    sequence:
      - action: rest_command.life_quest_update
        data:
          quest_id: "{{ quest_id }}"
          name: "{{ name }}"
          category_id: "{{ category_id }}"
          quest_type: "{{ quest_type }}"
          description: "{{ description | default(none) }}"
          xp_mode: "{{ xp_mode }}"
          fixed_xp: "{{ fixed_xp | default(none) }}"
          estimated_minutes: "{{ estimated_minutes | default(none) }}"
          kbr: "{{ kbr | default(none) }}"
          frequency_days: "{{ frequency_days | default(none) }}"
          project_factor: "{{ project_factor | default(none) }}"
          weekdays: "{{ weekdays | default([]) }}"
          interval_days: "{{ interval_days | default(none) }}"
          next_due: "{{ next_due | default(none) }}"
          active: "{{ active | default(true) }}"

  life_reward_create:
    alias: Life Manager - Reward erstellen
    sequence:
      - action: rest_command.life_reward_create
        data:
          name: "{{ name }}"
          description: "{{ description | default(none) }}"
          cost: "{{ cost }}"
          icon: "{{ icon | default(none) }}"
          active: "{{ active | default(true) }}"
          sort_order: "{{ sort_order | default(0) }}"

  life_reward_update:
    alias: Life Manager - Reward bearbeiten
    sequence:
      - action: rest_command.life_reward_update
        data:
          reward_id: "{{ reward_id }}"
          name: "{{ name }}"
          description: "{{ description | default(none) }}"
          cost: "{{ cost }}"
          icon: "{{ icon | default(none) }}"
          active: "{{ active | default(true) }}"
          sort_order: "{{ sort_order | default(0) }}"

  life_reward_toggle:
    alias: Life Manager - Reward aktivieren/deaktivieren
    sequence:
      - action: rest_command.life_reward_toggle
        data:
          reward_id: "{{ reward_id }}"

  life_savings_goal_create:
    alias: Life Manager - Sparziel erstellen
    sequence:
      - action: rest_command.life_savings_goal_create
        data:
          name: "{{ name }}"
          target_coins: "{{ target_coins }}"
          reward_id: "{{ reward_id | default(none) }}"


automation:
  - id: life_manager_daily_finalize
    alias: Life Manager - Automatischer Tagesabschluss
    mode: single
    trigger:
      - platform: time
        at: "23:55:00"
    action:
      - action: script.life_day_finalize
