type: vertical-stack
cards:
  - type: custom:life-manager-player-card
    entity: sensor.life_manager

  - type: custom:life-manager-card
    entity: sensor.life_manager
    script: script.life_quest_complete

  - type: custom:life-manager-reward-card
    entity: sensor.life_manager
    script: script.life_reward_purchase

  - type: custom:life-manager-quest-manager-card
    entity: sensor.life_manager
    create_script: script.life_quest_create
    update_script: script.life_quest_update
    toggle_script: script.life_quest_toggle


- type: custom:life-manager-achievements-card
  entity: sensor.life_manager
  title: Achievements

- type: custom:life-manager-boss-card
  entity: sensor.life_manager
  title: Boss Fights


- type: custom:life-manager-savings-card
  entity: sensor.life_manager
  title: Sparziele
  script: script.life_savings_goal_create

- type: custom:life-manager-coin-history-card
  entity: sensor.life_manager
  title: Coin History

- type: custom:life-manager-reward-manager-card
  entity: sensor.life_manager
  title: Reward Manager
  create_script: script.life_reward_create
  update_script: script.life_reward_update
  toggle_script: script.life_reward_toggle
